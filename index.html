<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Maklumat Pendaki Aki-Aki trail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333333;
            text-align: center;
            font-size: 1.5rem;
            line-height: 1.3;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555555;
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-transform: uppercase; /* Forces text to display as uppercase while typing */
        }

        .phone-wrapper {
            display: flex;
            margin-bottom: 15px;
            width: 100%;
        }

        .phone-prefix {
            background-color: #eeeeee;
            border: 1px solid #cccccc;
            border-right: none;
            padding: 10px;
            border-radius: 5px 0 0 5px;
            font-size: 16px;
            color: #555555;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-wrapper input[type="tel"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 0 5px 5px 0;
            font-family: Arial, sans-serif;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Maklumat Pendaki Aki-Aki trail</h2>
        
        <form name="google-sheet-form">
            
            <label for="name">FULL NAME</label>
            <input type="text" id="name" name="Nama Penuh" placeholder="E.G. ALI BIN ABU" required>
            
            <label for="ic_passport">IC no. / Passport</label>
            <input type="text" id="ic_passport" name="IC/passport" placeholder="E.G. 900101-12-3456" required>
            
            <label for="phone">Phone Number</label>
            <div class="phone-wrapper">
                <span class="phone-prefix">+60</span>
                <input type="tel" id="phone" name="Nombor Telefon" placeholder="123456789" required>
            </div>
            
            <label for="alamat">Alamat</label>
            <textarea id="alamat" name="Alamat" rows="3" placeholder="ENTER FULL ADDRESS..." required>KENINGAU</textarea>
            
            <button type="submit">Submit Details</button>
            
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwGoMEpV5NTiT4Blywk1uDOqRJ0FJ-u4GmyWv9g-K174JW3mcouO9tCq7DAtABnQZpT9A/exec';
        const form = document.forms['google-sheet-form'];

        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            // Grabs the name and ensures the pop-up alert is also in uppercase
            const userName = document.getElementById('name').value.toUpperCase();
            const submitButton = form.querySelector('button[type="submit"]');
            
            submitButton.disabled = true;
            submitButton.innerText = "Sending...";

            const formData = new FormData(form);
            
            // Converts the form data to uppercase right before sending it to Google Sheets
            formData.set('Nama Penuh', formData.get('Nama Penuh').toUpperCase());
            formData.set('IC/passport', formData.get('IC/passport').toUpperCase());
            formData.set('Alamat', formData.get('Alamat').toUpperCase());
            
            const rawPhone = formData.get('Nombor Telefon');
            formData.set('Nombor Telefon', '+60' + rawPhone);
            
            fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors'})
                .then(response => {
                    alert("Terima Kasih " + userName + "!");
                    form.reset(); 
                    
                    document.getElementById('alamat').value = "KENINGAU"; 
                    
                    submitButton.disabled = false;
                    submitButton.innerText = "Submit Details";
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    submitButton.disabled = false;
                    submitButton.innerText = "Submit Details";
                });
        });
    </script>

</body>
</html>
